name: Observability Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/observability.yml'
      - 'apps/server/pom.xml'
      - 'apps/server/src/main/resources/application.yml'
      - 'deploy/config/otel-collector*.yaml'
      - 'deploy/compose/dev.yml'
      - 'deploy/compose/demo.yml'
      - 'docs/engineering/observability.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/observability.yml'
      - 'apps/server/pom.xml'
      - 'apps/server/src/main/resources/application.yml'
      - 'deploy/config/otel-collector*.yaml'
      - 'deploy/compose/dev.yml'
      - 'deploy/compose/demo.yml'
      - 'docs/engineering/observability.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observability-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate server observability dependencies
        run: bash apps/server/mvnw -f apps/server/pom.xml -DskipTests dependency:tree

      - name: Validate runtime collector configuration
        env:
          IAM_OTEL_EXPORTER_ENDPOINT: https://otlp.example.com
          IAM_OTEL_EXPORTER_AUTHORIZATION: Bearer validation-only
        run: |
          docker run --rm \
            -e IAM_OTEL_EXPORTER_ENDPOINT \
            -e IAM_OTEL_EXPORTER_AUTHORIZATION \
            -v "${PWD}/deploy/config/otel-collector.runtime.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.159.0 \
            validate --config=/etc/otelcol-contrib/config.yaml

      - name: Guard telemetry redaction contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'attributes/redact' deploy/config/otel-collector.runtime.yaml
          grep -qi 'authorization' deploy/config/otel-collector.runtime.yaml
          grep -qi 'cookie' deploy/config/otel-collector.runtime.yaml
          grep -qi 'private_key' deploy/config/otel-collector.runtime.yaml
