name: Temporary docs lock refresh

on:
  push:
    branches:
      - chore/docs-site-security-overrides
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/docs-site-security-overrides

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Refresh lockfile
        working-directory: docs-site
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile when changed
        run: |
          if git diff --quiet -- docs-site/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs-site/package-lock.json
          git commit -m "security: refresh docs-site lockfile"
          git push origin HEAD:chore/docs-site-security-overrides
