name: Docs CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs-site/**'
      - 'docs/public/**'
      - 'docs/engineering/docs-publishing.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs-site/**'
      - 'docs/public/**'
      - 'docs/engineering/docs-publishing.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: build-and-publish-docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY_ENABLED == 'true' && 'docs' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install documentation dependencies
        working-directory: docs-site
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build documentation
        working-directory: docs-site
        run: npm run build

      - name: Require Cloudflare Pages configuration
        if: github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY_ENABLED == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required docs deployment setting: ${name}" >&2
              exit 1
            fi
          done

      - name: Publish to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy docs-site/build --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
