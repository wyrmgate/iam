name: Docs CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs-site/**'
      - 'docs/public/**'
      - 'docs/engineering/docs-publishing.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs-site/**'
      - 'docs/public/**'
      - 'docs/engineering/docs-publishing.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Regenerate documentation dependency lock
        working-directory: docs-site
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated dependency lock on bootstrap branch
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/reproducible-toolchain'
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs-site/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'security: lock patched docs dependency graph'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Install locked documentation dependencies
        working-directory: docs-site
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build documentation
        working-directory: docs-site
        run: npm run build

  publish:
    name: publish-docs
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install locked documentation dependencies
        working-directory: docs-site
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build documentation
        working-directory: docs-site
        run: npm run build

      - name: Require Cloudflare Pages configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required docs deployment setting: ${name}" >&2
              exit 1
            fi
          done

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy docs-site/build --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
