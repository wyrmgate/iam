name: DEV Deployment Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dev-cd.yml'
      - 'apps/console/**'
      - 'apps/server/**'
      - 'docs/engineering/dev-cd.md'
      - 'docs/operations/dev-managed-activation.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dev-cd.yml'
      - 'apps/console/**'
      - 'apps/server/**'
      - 'docs/engineering/dev-cd.md'
      - 'docs/operations/dev-managed-activation.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-deployment-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: pages-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/console/package.json

      - name: Install console dependencies
        run: npm --prefix apps/console install --no-audit --no-fund

      - name: Build console
        run: npm --prefix apps/console run build

      - name: Validate Pages Function and routing contract
        shell: bash
        run: |
          set -euo pipefail
          node --check 'apps/console/functions/api/[[path]].js'
          cmp apps/console/public/_routes.json apps/console/dist/_routes.json
          python - <<'PY'
          import json
          from pathlib import Path

          routes = json.loads(Path('apps/console/public/_routes.json').read_text())
          if routes != {'version': 1, 'include': ['/api/*'], 'exclude': []}:
              raise SystemExit('Pages Functions must be limited to /api/* so static routes stay static.')

          function = Path('apps/console/functions/api/[[path]].js').read_text()
          if 'IAM_BACKEND_ORIGIN' not in function:
              raise SystemExit('Pages proxy must use IAM_BACKEND_ORIGIN.')
          PY

  server:
    name: railway-server-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/server/pom.xml

      - name: Verify server
        run: make server-build

      - name: Validate managed-runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'port: ${PORT:8080}' apps/server/src/main/resources/application.yml
          grep -Fq '${IAM_DB_URL:' apps/server/src/main/resources/application.yml
          grep -Fq '${IAM_DB_USER:' apps/server/src/main/resources/application.yml
          grep -Fq '${IAM_DB_PASSWORD:' apps/server/src/main/resources/application.yml
          grep -Fq 'COPY apps/server/pom.xml' apps/server/Dockerfile
          grep -Fq 'COPY apps/server ' apps/server/Dockerfile
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('apps/server/railway.json').read_text())
          build = config.get('build', {})
          deploy = config.get('deploy', {})

          if build.get('builder') != 'DOCKERFILE':
              raise SystemExit('Railway must use the checked-in server Dockerfile.')
          if build.get('dockerfilePath') != 'apps/server/Dockerfile':
              raise SystemExit('Railway Dockerfile path must be repository-root relative.')
          if deploy.get('healthcheckPath') != '/actuator/health':
              raise SystemExit('Railway health check must use /actuator/health.')
          PY

  docs:
    name: managed-dev-docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require one active DEV topology
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Cloudflare Pages' docs/engineering/dev-cd.md
          grep -Fq 'Railway' docs/engineering/dev-cd.md
          grep -Fq 'Neon' docs/engineering/dev-cd.md
          grep -Fq 'repository root' docs/engineering/dev-cd.md
          grep -Fq 'optional/reference' infra/opentofu/README.md
          test -f apps/server/railway.json
          test -f docs/operations/dev-managed-activation.md
