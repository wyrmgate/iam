name: DEV Deployment Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dev-cd.yml'
      - 'apps/console/**'
      - 'docs/engineering/dev-cd.md'
      - 'docs/operations/dev-managed-activation.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dev-cd.yml'
      - 'apps/console/**'
      - 'docs/engineering/dev-cd.md'
      - 'docs/operations/dev-managed-activation.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-deployment-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: pages-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/console/package.json

      - name: Install console dependencies
        run: npm --prefix apps/console install --no-audit --no-fund

      - name: Build console
        run: npm --prefix apps/console run build

      - name: Validate Pages Function and routing contract
        shell: bash
        run: |
          set -euo pipefail
          node --check 'apps/console/functions/api/[[path]].js'
          cmp apps/console/public/_routes.json apps/console/dist/_routes.json
          python - <<'PY'
          import json
          from pathlib import Path

          routes = json.loads(Path('apps/console/public/_routes.json').read_text())
          if routes != {'version': 1, 'include': ['/api/*'], 'exclude': []}:
              raise SystemExit('Pages Functions must be limited to /api/* so static routes stay static.')

          function = Path('apps/console/functions/api/[[path]].js').read_text()
          if 'IAM_BACKEND_ORIGIN' not in function:
              raise SystemExit('Pages proxy must use IAM_BACKEND_ORIGIN.')
          PY

  docs:
    name: dev-topology-docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require current DEV topology statement
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Railway backend is retired' docs/engineering/dev-cd.md
          grep -Fq 'No replacement managed server target is currently canonical' docs/engineering/dev-cd.md
          grep -Fq 'Core CI' docs/engineering/dev-cd.md
          test -f docs/operations/dev-managed-activation.md
