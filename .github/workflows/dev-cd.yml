name: DEV Deployment Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dev-cd.yml'
      - '.dockerignore'
      - 'apps/console/**'
      - 'apps/server/**'
      - 'docs/README.md'
      - 'docs/engineering/dev-cd.md'
      - 'docs/engineering/public-demo.md'
      - 'docs/engineering/edge.md'
      - 'docs/engineering/observability.md'
      - 'docs/operations/dev-managed-activation.md'
      - 'docs/operations/first-run-web-setup.md'
      - 'scripts/ci/component-changes.sh'
      - 'scripts/ci/dev-bootstrap-entrypoint.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dev-cd.yml'
      - '.dockerignore'
      - 'apps/console/**'
      - 'apps/server/**'
      - 'docs/README.md'
      - 'docs/engineering/dev-cd.md'
      - 'docs/engineering/public-demo.md'
      - 'docs/engineering/edge.md'
      - 'docs/engineering/observability.md'
      - 'docs/operations/dev-managed-activation.md'
      - 'docs/operations/first-run-web-setup.md'
      - 'scripts/ci/component-changes.sh'
      - 'scripts/ci/dev-bootstrap-entrypoint.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-deployment-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: component-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages: ${{ steps.classify.outputs.dev_pages }}
      server: ${{ steps.classify.outputs.dev_server }}
      docs: ${{ steps.classify.outputs.dev_docs }}
    steps:
      - name: Checkout history for change classification
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed components
        id: classify
        run: bash scripts/ci/component-changes.sh

  pages:
    name: pages-contract
    needs: changes
    if: needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/console/package.json

      - name: Install console dependencies
        run: npm --prefix apps/console install --no-audit --no-fund

      - name: Build console
        run: npm --prefix apps/console run build

      - name: Validate Pages Function and routing contract
        shell: bash
        run: |
          set -euo pipefail
          node --check 'apps/console/functions/api/[[path]].js'
          cmp apps/console/public/_routes.json apps/console/dist/_routes.json
          python - <<'PY'
          import json
          from pathlib import Path

          routes = json.loads(Path('apps/console/public/_routes.json').read_text())
          if routes != {'version': 1, 'include': ['/api/*'], 'exclude': []}:
              raise SystemExit('Pages Functions must be limited to /api/* so static routes stay static.')

          function = Path('apps/console/functions/api/[[path]].js').read_text()
          if 'IAM_BACKEND_ORIGIN' not in function:
              raise SystemExit('Pages proxy must use IAM_BACKEND_ORIGIN.')
          PY

  server:
    name: railway-server-contract
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Railway-compatible server and wizard-bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/server/Dockerfile
          test -f apps/server/docker-entrypoint.sh
          grep -Fq 'COPY apps/server/pom.xml' apps/server/Dockerfile
          grep -Fq 'COPY apps/server ' apps/server/Dockerfile
          grep -Fq 'COPY --chown=10001:10001 apps/server/docker-entrypoint.sh' apps/server/Dockerfile
          grep -Fq 'EXPOSE 8080' apps/server/Dockerfile
          grep -Fq 'ENTRYPOINT ["/app/docker-entrypoint.sh"]' apps/server/Dockerfile
          grep -Fq 'CMD ["java"' apps/server/Dockerfile
          grep -Fq 'port: ${PORT:8080}' apps/server/src/main/resources/application.yml
          grep -Fq '${IAM_DB_URL:' apps/server/src/main/resources/application.yml
          grep -Fq '${IAM_DB_USER:' apps/server/src/main/resources/application.yml
          grep -Fq '${IAM_DB_PASSWORD:' apps/server/src/main/resources/application.yml
          grep -Fq '${IAM_DEPLOYMENT_ENVIRONMENT:' apps/server/src/main/resources/application.yml
          grep -Fq 'include: health,info' apps/server/src/main/resources/application.yml
          test ! -f apps/server/railway.json
          sh scripts/ci/dev-bootstrap-entrypoint.sh

  docs:
    name: dev-topology-docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require current DEV topology statement
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Railway Serverless is the selected shared DEV compute target' docs/engineering/dev-cd.md
          grep -Fq 'Cloudflare Pages + Pages Functions, Railway Serverless, and Neon PostgreSQL' docs/engineering/dev-cd.md
          grep -Fq 'Wait for CI' docs/engineering/dev-cd.md
          grep -Fq 'legacy Railway Config-as-Code file is not restored' docs/engineering/dev-cd.md
          grep -Fq 'first-run web setup wizard is the only supported fresh-install path for shared DEV' docs/engineering/dev-cd.md
          grep -Fq 'activation is not complete until' docs/operations/dev-managed-activation.md
          grep -Fq 'IAM_BOOTSTRAP_WEB_SETUP_SECRET' docs/operations/dev-managed-activation.md
          test -f docs/operations/dev-managed-activation.md
