name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without leading v (for example 0.3.0)
        required: true
        type: string
      sha:
        description: Full 40-character main commit SHA to release
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: read
  id-token: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: release-v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    env:
      VERSION: ${{ inputs.version }}
      TARGET_SHA: ${{ inputs.sha }}
      SERVER_IMAGE: ghcr.io/wyrmgate/iam-server
      CONSOLE_IMAGE: ghcr.io/wyrmgate/iam-console
      COSIGN_IDENTITY: https://github.com/wyrmgate/iam/.github/workflows/container.yml@refs/heads/main
      COSIGN_ISSUER: https://token.actions.githubusercontent.com
      RELEASE_COSIGN_IDENTITY: https://github.com/wyrmgate/iam/.github/workflows/release.yml@refs/heads/main
    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "version must be a semantic version without a leading v" >&2
            exit 1
          fi
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha must be a full 40-character lowercase Git commit SHA" >&2
            exit 1
          fi

      - name: Checkout main with history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Require target revision on main
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_SHA}^{commit}"
          if ! git merge-base --is-ancestor "${TARGET_SHA}" origin/main; then
            echo "Target SHA is not reachable from main." >&2
            exit 1
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image digests
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          resolve_digest() {
            local image="$1"
            local tag="${image}:sha-${TARGET_SHA}"
            local digest
            digest="$(docker buildx imagetools inspect "${tag}" | awk '/^Digest:/ {print $2; exit}')"
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Unable to resolve digest for ${tag}" >&2
              exit 1
            fi
            printf '%s' "${digest}"
          }
          server_digest="$(resolve_digest "${SERVER_IMAGE}")"
          console_digest="$(resolve_digest "${CONSOLE_IMAGE}")"
          echo "server=${server_digest}" >> "${GITHUB_OUTPUT}"
          echo "console=${console_digest}" >> "${GITHUB_OUTPUT}"

      - name: Verify published image signatures
        shell: bash
        env:
          SERVER_DIGEST: ${{ steps.digests.outputs.server }}
          CONSOLE_DIGEST: ${{ steps.digests.outputs.console }}
        run: |
          set -euo pipefail
          for artifact in \
            "${SERVER_IMAGE}@${SERVER_DIGEST}" \
            "${CONSOLE_IMAGE}@${CONSOLE_DIGEST}"; do
            cosign verify "${artifact}" \
              --certificate-identity "${COSIGN_IDENTITY}" \
              --certificate-oidc-issuer "${COSIGN_ISSUER}"
          done

      - name: Ensure release version is unused
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists." >&2
            exit 1
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists." >&2
            exit 1
          fi

      - name: Create release manifest
        shell: bash
        env:
          SERVER_DIGEST: ${{ steps.digests.outputs.server }}
          CONSOLE_DIGEST: ${{ steps.digests.outputs.console }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          manifest = {
              "schemaVersion": 1,
              "product": "Wyrmgate IAM",
              "version": os.environ["VERSION"],
              "sourceRevision": os.environ["TARGET_SHA"],
              "createdAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "artifacts": {
                  "server": {
                      "repository": os.environ["SERVER_IMAGE"],
                      "digest": os.environ["SERVER_DIGEST"],
                      "sourceTag": f"sha-{os.environ['TARGET_SHA']}",
                  },
                  "console": {
                      "repository": os.environ["CONSOLE_IMAGE"],
                      "digest": os.environ["CONSOLE_DIGEST"],
                      "sourceTag": f"sha-{os.environ['TARGET_SHA']}",
                  },
              },
          }
          with open("release-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          sha256sum release-manifest.json > release-manifest.json.sha256

      - name: Sign release manifest
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle release-manifest.sigstore.json \
            release-manifest.json
          cosign verify-blob release-manifest.json \
            --bundle release-manifest.sigstore.json \
            --certificate-identity "${RELEASE_COSIGN_IDENTITY}" \
            --certificate-oidc-issuer "${COSIGN_ISSUER}"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            "v${VERSION}"
            release-manifest.json
            release-manifest.json.sha256
            release-manifest.sigstore.json
            --target "${TARGET_SHA}"
            --title "Wyrmgate IAM v${VERSION}"
            --generate-notes
            --verify-tag=false
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

      - name: Publish release summary
        shell: bash
        env:
          SERVER_DIGEST: ${{ steps.digests.outputs.server }}
          CONSOLE_DIGEST: ${{ steps.digests.outputs.console }}
        run: |
          {
            echo "## Wyrmgate IAM v${VERSION}"
            echo
            echo "- Source revision: \`${TARGET_SHA}\`"
            echo "- Server: \`${SERVER_IMAGE}@${SERVER_DIGEST}\`"
            echo "- Console: \`${CONSOLE_IMAGE}@${CONSOLE_DIGEST}\`"
            echo "- Release manifest: signed with the release workflow's GitHub OIDC identity"
          } >> "${GITHUB_STEP_SUMMARY}"
