name: Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: component-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server_dependencies: ${{ steps.classify.outputs.security_server_deps }}
      console_dependencies: ${{ steps.classify.outputs.security_console_deps }}
    steps:
      - name: Checkout history for change classification
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed components
        id: classify
        run: bash scripts/ci/component-changes.sh

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --verbose .

  filesystem-security:
    name: filesystem-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan dependencies and repository configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  server-dependencies:
    name: server-dependencies
    needs: changes
    if: needs.changes.outputs.server_dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/server/pom.xml

      - name: Resolve Maven dependency tree
        run: sh ./apps/server/mvnw -f apps/server/pom.xml dependency:tree -DoutputType=text

  console-dependencies:
    name: console-dependencies
    needs: changes
    if: needs.changes.outputs.console_dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Audit console dependencies
        run: |
          npm --prefix apps/console install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix apps/console audit --audit-level=high --omit=dev
