name: Reconcile Identity Runtime Status

on:
  push:
    branches:
      - feature/identity-http-runtime
    paths:
      - .github/workflows/reconcile-identity-runtime.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/identity-http-runtime
      - name: Reconcile runtime status
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "apps/server/src/main/resources/contracts/openapi/identity-v1.json": [
                  (
                      "Contract-first public Identity API slice for OD-003. Runtime exposure remains gated on IAM control-plane authentication and scoped administrative authorization.",
                      "Runtime public Identity API slice for OD-003. Every operation is gated by trusted control-plane authentication, server-side tenant/governed-actor resolution, and scoped Administrative Authorization."
                  ),
                  (
                      '"x-wyrmgate-contract-status": "contract-first-not-runtime-exposed"',
                      '"x-wyrmgate-contract-status": "runtime-exposed-authenticated-authorized"'
                  ),
              ],
              "scripts/verify-api-contracts.py": [
                  (
                      'assert document.get("x-wyrmgate-contract-status") == "contract-first-not-runtime-exposed"',
                      'assert document.get("x-wyrmgate-contract-status") == "runtime-exposed-authenticated-authorized"'
                  ),
              ],
              "docs/api/identity-contracts.md": [
                  (
                      "This slice remains **contract-first and not yet runtime-exposed**. Provider-neutral bearer validation, server-side tenant/governed-actor resolution, burn-once initial-administrator bootstrap, and the scoped Administrative Authorization evaluator now exist. Runtime Identity controllers remain absent until each HTTP operation is wired to both the trusted actor context and the required `identity:*` permission at operation time.",
                      "This slice is now **runtime-exposed when control-plane authentication is enabled**. Provider-neutral bearer validation resolves the external subject through the Administration-owned tenant/governed-actor binding, and every Identity HTTP operation evaluates the required `identity:*` permission through `AdministrativeAuthorizationService` at operation time. When bearer authentication is not configured, `/api/v1/**` remains closed."
                  ),
                  (
                      "The authentication, trusted actor/tenant resolution, burn-once bootstrap, and direct-grant evaluator foundations now exist. Runtime activation still requires each HTTP adapter to enforce both the authenticated actor context and the semantic Administration decision for the requested operation. Relationship/ownership context, policy/assurance requirements and sensitive authorization-decision audit hooks are added as the corresponding governed operations require them.",
                      "The authentication, trusted actor/tenant resolution, burn-once bootstrap, direct-grant evaluator, and Identity HTTP adapters now form one enforced chain. Collection operations require a grant that can authorize the collection; exact resource operations evaluate that resource ID. Relationship/ownership context, policy/assurance requirements and sensitive authorization-decision audit hooks are added as corresponding governed operations require them."
                  ),
                  (
                      "A classified value can be redacted while its governed metadata remains visible.",
                      "A classified value can be redacted while its governed metadata remains visible. In this first runtime slice, canonical values and provenance are deliberately returned as `REDACTED` metadata-only views until a classification-aware value-visibility policy is implemented; `identity:read` alone does not imply permission to read every classified canonical value. Effective read evaluation honors override validity and current authority/candidate state without turning GET into a mutating resolution command."
                  ),
              ],
              "docs/README.md": [
                  (
                      "Runtime Identity controllers are still intentionally absent. The next OD-003 runtime slice must bind each Identity HTTP operation to the authenticated actor context and `AdministrativeAuthorizationService`, including semantic permissions, revision/idempotency/pagination/error behavior from the existing contract. Bearer possession alone is never authorization.",
                      "The first runtime Identity HTTP slice is now implemented for the checked-in contract: create/read/list, display-name update, and canonical-attribute metadata reads. Each operation consumes the trusted authenticated actor context and re-evaluates `AdministrativeAuthorizationService`; bearer possession alone is never authorization. Mutations use causal idempotency and revision semantics, collections use deterministic opaque cursors, and canonical values remain fail-closed/redacted until classification-aware value visibility exists."
                  ),
                  (
                      "Remaining open design areas therefore include completion of OD-003 machine-readable API/event coverage and runtime activation, the remote connector-worker protocol (OD-004), operations/HA/DR (OD-005), and legacy migration/cutover (OD-006).",
                      "Remaining open design areas therefore include completion of OD-003 coverage beyond this Identity runtime slice and external event publication/compatibility process, the remote connector-worker protocol (OD-004), operations/HA/DR (OD-005), and legacy migration/cutover (OD-006)."
                  ),
              ],
              "apps/server/README.md": [
                  (
                      "OD-003 now has a first checked-in, contract-first Identity interface slice:",
                      "OD-003 now has a first secured runtime Identity interface slice:"
                  ),
                  (
                      "These contracts are intentionally **not runtime-exposed yet**. The Administration evaluator plus trusted bearer authentication, server-side tenant+actor resolution, and burn-once initial-administrator provisioning now exist. The next slice must wire each Identity HTTP operation to both the authenticated actor context and semantic Administration permission checks. Internal outbox facts are likewise not automatically external events; publication wiring remains a separate adapter/integration concern.",
                      "The corresponding `/api/v1/identities` runtime adapter is now implemented. Trusted bearer authentication resolves tenant + governed actor server-side, and every operation re-evaluates semantic Administration permissions. Create and display-name mutation use causal idempotency; display-name update also enforces `If-Match`; list surfaces use deterministic opaque cursors; semantic public errors hide framework/database details. Canonical-attribute values are currently metadata-only and `REDACTED` until classification-aware value visibility is implemented. Internal outbox facts are still not automatically external events; publication wiring remains a separate adapter/integration concern."
                  ),
                  (
                      "Not yet implemented in Identity: source-import destructive absence processing, organizations/manager/owner relationships, principals, merge/split, runtime public Identity controllers, or external integration-event publication.",
                      "Not yet implemented in Identity: source-import destructive absence processing, organizations/manager/owner relationships, principals, merge/split, lifecycle transition HTTP operations, classification-aware canonical-value disclosure, or external integration-event publication."
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected text missing from {filename}: {old[:100]}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/reconcile-identity-runtime.yml").unlink()
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: activate Identity runtime contract status"
          git push origin HEAD:feature/identity-http-runtime
