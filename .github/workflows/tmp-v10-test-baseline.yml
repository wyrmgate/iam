name: Temporary V10 Test Baseline

on:
  push:
    branches:
      - feature/control-plane-auth-bootstrap
    paths:
      - .github/workflows/tmp-v10-test-baseline.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/control-plane-auth-bootstrap
      - name: Update migration version assertions and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed = 0
          for path in Path('apps/server/src/test/java').rglob('*.java'):
              text = path.read_text()
              updated = text.replace('getVersion()).isEqualTo("9")', 'getVersion()).isEqualTo("10")')
              if updated != text:
                  path.write_text(updated)
                  changed += 1
          print(f'updated {changed} test files')
          if changed < 5:
              raise SystemExit('expected at least five V9 migration assertions')
          PY
          git rm .github/workflows/tmp-v10-test-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/test/java
          git commit -m "tests: expect control-plane security migration"
          git push origin HEAD:feature/control-plane-auth-bootstrap
