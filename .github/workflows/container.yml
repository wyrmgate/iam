name: Container CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: component-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      server: ${{ steps.classify.outputs.container_server }}
      console: ${{ steps.classify.outputs.container_console }}
    steps:
      - name: Checkout history for change classification
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed components
        id: classify
        run: bash scripts/ci/component-changes.sh

  server-image:
    name: server-image
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server image for validation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: wyrmgate/iam-server:ci
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image

      - name: Scan server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wyrmgate/iam-server:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  console-image:
    name: console-image
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build console image for validation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/console/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: wyrmgate/iam-console:ci
          cache-from: type=gha,scope=console-image
          cache-to: type=gha,mode=max,scope=console-image

      - name: Scan console image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wyrmgate/iam-console:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  publish-server-image:
    name: publish-server
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish server image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/wyrmgate/iam-server:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image

      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/wyrmgate/iam-server@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Sign published image by digest
        env:
          IMAGE: ghcr.io/wyrmgate/iam-server
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify keyless signature
        env:
          IMAGE: ghcr.io/wyrmgate/iam-server
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/wyrmgate/iam/.github/workflows/container.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  publish-console-image:
    name: publish-console
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish console image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/wyrmgate/iam-console:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=console-image
          cache-to: type=gha,mode=max,scope=console-image

      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/wyrmgate/iam-console@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Sign published image by digest
        env:
          IMAGE: ghcr.io/wyrmgate/iam-console
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify keyless signature
        env:
          IMAGE: ghcr.io/wyrmgate/iam-console
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/wyrmgate/iam/.github/workflows/container.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
