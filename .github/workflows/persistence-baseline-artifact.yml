name: Persistence Baseline CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/src/main/resources/db/migration/**'
      - 'apps/server/src/test/resources/db/history/pre-rebaseline/**'
      - 'apps/server/src/test/java/io/wyrmgate/iam/platform/persistence/**'
      - 'tools/split-persistence-baseline.py'
      - '.github/workflows/persistence-baseline-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/server/pom.xml

      - name: Generate capability baseline candidate
        run: |
          rm -rf /tmp/wyrmgate-capability-baseline
          python3 tools/split-persistence-baseline.py \
            apps/server/src/main/resources/db/migration/V2__current_schema_baseline.sql \
            /tmp/wyrmgate-capability-baseline
          test "$(find /tmp/wyrmgate-capability-baseline -maxdepth 1 -type f -name 'V*.sql' | wc -l)" -eq 10

      - name: Start PostgreSQL
        run: |
          docker run --detach --rm --name wyrmgate-baseline-postgres \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_USER=wyrmgate \
            -e POSTGRES_PASSWORD=wyrmgate \
            -p 5432:5432 \
            postgres:18.4-alpine
          ready=0
          for attempt in $(seq 1 45); do
            if docker exec wyrmgate-baseline-postgres pg_isready -U wyrmgate -d postgres >/dev/null 2>&1 \
              && docker exec wyrmgate-baseline-postgres psql -U wyrmgate -d postgres -Atc 'select 1' | grep -qx 1; then
              ready=$((ready + 1))
              if [ "$ready" -ge 2 ]; then break; fi
            else
              ready=0
            fi
            sleep 1
          done
          test "$ready" -ge 2
          docker exec wyrmgate-baseline-postgres createdb -U wyrmgate reference
          docker exec wyrmgate-baseline-postgres createdb -U wyrmgate candidate

      - name: Apply current V1/V2 checkpoint
        env:
          IAM_DB_URL: jdbc:postgresql://localhost:5432/reference
          IAM_DB_USER: wyrmgate
          IAM_DB_PASSWORD: wyrmgate
          IAM_AUTH_ENABLED: 'false'
          IAM_OTEL_ENABLED: 'false'
        run: |
          sh ./apps/server/mvnw -f apps/server/pom.xml \
            -Dspring-boot.run.arguments="--spring.main.web-application-type=none --wyrmgate.migrate-only=true" \
            spring-boot:run

      - name: Apply capability baseline candidate
        env:
          IAM_DB_URL: jdbc:postgresql://localhost:5432/candidate
          IAM_DB_USER: wyrmgate
          IAM_DB_PASSWORD: wyrmgate
          IAM_AUTH_ENABLED: 'false'
          IAM_OTEL_ENABLED: 'false'
        run: |
          sh ./apps/server/mvnw -f apps/server/pom.xml \
            -Dspring-boot.run.arguments="--spring.main.web-application-type=none --spring.flyway.locations=filesystem:/tmp/wyrmgate-capability-baseline --wyrmgate.migrate-only=true" \
            spring-boot:run

      - name: Compare normalized schemas
        run: |
          mkdir -p /tmp/wyrmgate-schema-diff
          for database in reference candidate; do
            docker exec wyrmgate-baseline-postgres \
              pg_dump -U wyrmgate -d "$database" \
                --schema-only --no-owner --no-privileges \
                --exclude-table=public.flyway_schema_history \
              > "/tmp/wyrmgate-schema-diff/$database.raw.sql"
          done
          python3 - <<'PY'
          from pathlib import Path
          def normalize(path: Path) -> str:
              output=[]; in_dollar=False; previous_blank=False
              for line in path.read_text().splitlines():
                  if line.startswith('\\restrict') or line.startswith('\\unrestrict'): continue
                  if not in_dollar and (line.startswith('--') or line.startswith('SET ') or line.startswith("SELECT pg_catalog.set_config('search_path'")): continue
                  blank=not line.strip()
                  if blank and previous_blank: continue
                  output.append(line.rstrip()); previous_blank=blank
                  if line.count('$$') % 2 == 1: in_dollar=not in_dollar
              return '\n'.join(output).strip()+'\n'
          root=Path('/tmp/wyrmgate-schema-diff')
          for database in ('reference','candidate'):
              (root/f'{database}.sql').write_text(normalize(root/f'{database}.raw.sql'))
          PY
          diff -u /tmp/wyrmgate-schema-diff/reference.sql /tmp/wyrmgate-schema-diff/candidate.sql

      - name: Upload generated capability baseline
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capability-baseline-candidate
          path: |
            /tmp/wyrmgate-capability-baseline/*.sql
            /tmp/wyrmgate-schema-diff/reference.sql
            /tmp/wyrmgate-schema-diff/candidate.sql
          if-no-files-found: error
