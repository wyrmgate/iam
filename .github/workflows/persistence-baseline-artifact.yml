name: Persistence Baseline CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/src/main/resources/db/migration/**'
      - 'apps/server/src/test/java/io/wyrmgate/iam/platform/persistence/**'
      - '.github/workflows/persistence-baseline-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/server/pom.xml

      - name: Guard capability baseline layout
        run: |
          set -euo pipefail
          runtime=apps/server/src/main/resources/db/migration

          expected=(
            V1__create_capability_schemas.sql
            V2__platform_baseline.sql
            V3__identity_baseline.sql
            V4__catalog_baseline.sql
            V5__access_baseline.sql
            V6__governance_baseline.sql
            V7__credential_baseline.sql
            V8__integration_baseline.sql
            V9__administration_baseline.sql
            V10__audit_baseline.sql
          )

          for migration in "${expected[@]}"; do
            test -f "$runtime/$migration" || {
              echo "Missing ADR-0048 baseline migration: $migration" >&2
              exit 1
            }
          done

          test ! -e apps/server/src/test/resources/db/history/pre-rebaseline
          test ! -e tools/split-persistence-baseline.py
          test ! -e "$runtime/V1__prepare_current_schema_baseline.sql"
          test ! -e "$runtime/V2__current_schema_baseline.sql"

          if find "$runtime" -maxdepth 1 -type f -name 'V70__*.sql' | grep -q .; then
            echo 'Withdrawn historical V70 is reserved and must not be reused.' >&2
            exit 1
          fi

      - name: Start empty PostgreSQL
        run: |
          docker run --detach --rm --name wyrmgate-baseline-postgres \
            -e POSTGRES_DB=wyrmgate \
            -e POSTGRES_USER=wyrmgate \
            -e POSTGRES_PASSWORD=wyrmgate \
            -p 5432:5432 \
            postgres:18.4-alpine
          ready=0
          for attempt in $(seq 1 45); do
            if docker exec wyrmgate-baseline-postgres pg_isready -U wyrmgate -d wyrmgate >/dev/null 2>&1 \
              && docker exec wyrmgate-baseline-postgres psql -U wyrmgate -d wyrmgate -Atc 'select 1' | grep -qx 1; then
              ready=$((ready + 1))
              if [ "$ready" -ge 2 ]; then break; fi
            else
              ready=0
            fi
            sleep 1
          done
          test "$ready" -ge 2

      - name: Apply active migration chain to empty database
        env:
          IAM_DB_URL: jdbc:postgresql://localhost:5432/wyrmgate
          IAM_DB_USER: wyrmgate
          IAM_DB_PASSWORD: wyrmgate
          IAM_AUTH_ENABLED: 'false'
          IAM_OTEL_ENABLED: 'false'
        run: |
          sh ./apps/server/mvnw -f apps/server/pom.xml \
            -Dspring-boot.run.arguments="--spring.main.web-application-type=none --wyrmgate.migrate-only=true" \
            spring-boot:run

      - name: Verify ADR-0048 baseline history
        run: |
          docker exec wyrmgate-baseline-postgres psql -U wyrmgate -d wyrmgate -Atc \
            "select version || ':' || script from public.flyway_schema_history where success and type='SQL' order by installed_rank" \
            | tee /tmp/baseline-history.txt

          expected=(
            '1:V1__create_capability_schemas.sql'
            '2:V2__platform_baseline.sql'
            '3:V3__identity_baseline.sql'
            '4:V4__catalog_baseline.sql'
            '5:V5__access_baseline.sql'
            '6:V6__governance_baseline.sql'
            '7:V7__credential_baseline.sql'
            '8:V8__integration_baseline.sql'
            '9:V9__administration_baseline.sql'
            '10:V10__audit_baseline.sql'
          )
          for row in "${expected[@]}"; do
            grep -Fx "$row" /tmp/baseline-history.txt
          done
          if grep -q '^70:' /tmp/baseline-history.txt; then
            echo 'Reserved V70 must not appear in Flyway history.' >&2
            exit 1
          fi

          schemas=$(docker exec wyrmgate-baseline-postgres psql -U wyrmgate -d wyrmgate -Atc \
            "select nspname from pg_namespace where nspname in ('platform','identity','catalog','access','governance','credential','integration','administration','audit') order by nspname")
          test "$(printf '%s\n' "$schemas" | sed '/^$/d' | wc -l)" -eq 9

      - name: Verify tenant isolation against active baseline
        run: |
          sh ./apps/server/mvnw -f apps/server/pom.xml \
            -Dtest=io.wyrmgate.iam.platform.persistence.TenantIsolationSchemaIntegrationTest \
            test

      - name: Capture current schema diagnostic
        if: always()
        run: |
          mkdir -p /tmp/wyrmgate-baseline
          docker exec wyrmgate-baseline-postgres \
            pg_dump -U wyrmgate -d wyrmgate \
              --schema-only --no-owner --no-privileges \
              --exclude-table=public.flyway_schema_history \
            > /tmp/wyrmgate-baseline/current-schema.sql || true

      - name: Upload baseline diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: persistence-baseline-diagnostics
          path: |
            /tmp/baseline-history.txt
            /tmp/wyrmgate-baseline/current-schema.sql
          if-no-files-found: warn
