name: Refactor shared Postgres tests

on:
  push:
    branches:
      - test/streamline-db-integration-fixtures

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[shared-postgres-refactor]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/streamline-db-integration-fixtures
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Clean transformed sources and audit heavyweight setup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('apps/server/src/test/java')
          changed = []
          removable_imports = (
              'import static io.wyrmgate.iam.platform.persistence.FlywayTestSupport.assertFullyMigrated;\n',
              'import org.flywaydb.core.Flyway;\n',
              'import org.springframework.jdbc.datasource.DriverManagerDataSource;\n',
              'import org.testcontainers.postgresql.PostgreSQLContainer;\n',
          )
          leftover_flyway = re.compile(
              r'\s*Flyway flyway = Flyway\.configure\(\)'
              r'.*?flyway\.validate\(\);\s*',
              re.DOTALL,
          )

          for path in sorted(root.rglob('*.java')):
              text = path.read_text()
              if 'SharedPostgresIntegrationDatabase.reset();' not in text:
                  continue
              updated = leftover_flyway.sub('\n', text)
              for line in removable_imports:
                  updated = updated.replace(line, '')
              updated = re.sub(r'(class\s+\w+[^\{]*\{)\nprivate static', r'\1\n\n    private static', updated)
              updated = updated.replace(
                  'SharedPostgresIntegrationDatabase.dataSource();\njdbc =',
                  'SharedPostgresIntegrationDatabase.dataSource();\n        jdbc =',
              )
              updated = updated.replace('\n@BeforeEach\n', '\n\n    @BeforeEach\n')
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))

          allowed_heavy = {
              root / 'io/wyrmgate/iam/platform/persistence/ApplicationFlywayStartupIntegrationTest.java',
              root / 'io/wyrmgate/iam/platform/persistence/SharedPostgresIntegrationDatabase.java',
          }
          violations = []
          for path in sorted(root.rglob('*.java')):
              text = path.read_text()
              if path not in allowed_heavy and any(token in text for token in (
                  'new PostgreSQLContainer(', 'POSTGRES.start();', 'Flyway.configure()'
              )):
                  violations.append(str(path))

          print(f'Cleaned {len(changed)} transformed test classes')
          if violations:
              print('Unexpected heavyweight database setup remains:')
              for path in violations:
                  print(path)
              raise SystemExit(1)
          print('Audit passed: only the shared fixture and dedicated migration test own heavyweight DB setup.')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/src/test/java
          git commit -m 'test(server): clean shared integration fixtures [shared-postgres-refactor]'
          git push origin HEAD:test/streamline-db-integration-fixtures
