name: Refactor shared Postgres tests

on:
  push:
    branches:
      - test/streamline-db-integration-fixtures

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[shared-postgres-refactor]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/streamline-db-integration-fixtures
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove redundant per-class Flyway setup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('apps/server/src/test/java')
          excluded = {
              'ApplicationFlywayStartupIntegrationTest.java',
              'SharedPostgresIntegrationDatabase.java',
          }
          changed = []

          postgres_field = re.compile(
              r'\n\s*private static final PostgreSQLContainer POSTGRES\s*=\s*'
              r'io\.wyrmgate\.iam\.platform\.persistence\.SharedPostgresIntegrationDatabase\.container\(\);\s*',
              re.MULTILINE,
          )
          datasource = re.compile(
              r'DriverManagerDataSource dataSource\s*=\s*new DriverManagerDataSource\(\s*'
              r'POSTGRES\.getJdbcUrl\(\),\s*POSTGRES\.getUsername\(\),\s*POSTGRES\.getPassword\(\)\);',
              re.MULTILINE,
          )
          flyway = re.compile(
              r'\s*Flyway flyway = Flyway\.configure\(\)'
              r'.*?assertFullyMigrated\(flyway\);\s*',
              re.DOTALL,
          )

          for path in sorted(root.rglob('*.java')):
              if path.name in excluded:
                  continue
              text = path.read_text()
              if 'SharedPostgresIntegrationDatabase.reset();' not in text:
                  continue

              updated = datasource.sub(
                  'var dataSource = io.wyrmgate.iam.platform.persistence.'
                  'SharedPostgresIntegrationDatabase.dataSource();',
                  text,
              )
              updated = flyway.sub('\n', updated)
              updated = postgres_field.sub('\n', updated)

              if 'Flyway' not in updated:
                  updated = updated.replace('import org.flywaydb.core.Flyway;\n', '')
              if 'assertFullyMigrated' not in updated:
                  updated = updated.replace(
                      'import static io.wyrmgate.iam.platform.persistence.FlywayTestSupport.assertFullyMigrated;\n',
                      '',
                  )
              if 'PostgreSQLContainer' not in updated:
                  updated = updated.replace(
                      'import org.testcontainers.postgresql.PostgreSQLContainer;\n',
                      '',
                  )
              if 'DriverManagerDataSource' not in updated:
                  updated = updated.replace(
                      'import org.springframework.jdbc.datasource.DriverManagerDataSource;\n',
                      '',
                  )

              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))

          print(f'Cleaned {len(changed)} test classes')
          for path in changed:
              print(path)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/src/test/java
          git commit -m 'test(server): remove repeated Flyway setup [shared-postgres-refactor]'
          git push origin HEAD:test/streamline-db-integration-fixtures
