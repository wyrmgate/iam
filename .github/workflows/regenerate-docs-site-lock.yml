name: Regenerate docs-site lockfile

on:
  push:
    branches:
      - security/docs-site-trivy-refresh

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: security/docs-site-trivy-refresh
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Regenerate lockfile
        run: npm --prefix docs-site install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs-site/package-lock.json; then
            echo "No lockfile change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs-site/package-lock.json
          git commit -m "chore(docs): regenerate dependency lockfile"
          git push origin HEAD:security/docs-site-trivy-refresh
