name: Dependency Lock Refresh

on:
  push:
    branches:
      - chore/dependency-maintenance-2026-10-08
    paths:
      - docs-site/package.json
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-docs-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/dependency-maintenance-2026-10-08

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Refresh docs lockfile
        working-directory: docs-site
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs-site/package-lock.json; then
            echo "docs-site/package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs-site/package-lock.json
          git commit -m "chore(deps): refresh docs lockfile"
          git push origin HEAD:chore/dependency-maintenance-2026-10-08
