name: Secrets Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/secure-config/**'
      - 'apps/server/src/main/java/io/wyrmgate/iam/platform/crypto/**'
      - 'apps/server/src/test/java/io/wyrmgate/iam/platform/crypto/**'
      - '.github/workflows/secrets.yml'
      - 'docs/engineering/secrets-key-management.md'
  push:
    branches: [main]
    paths:
      - 'deploy/secure-config/**'
      - 'apps/server/src/main/java/io/wyrmgate/iam/platform/crypto/**'
      - 'apps/server/src/test/java/io/wyrmgate/iam/platform/crypto/**'
      - '.github/workflows/secrets.yml'
      - 'docs/engineering/secrets-key-management.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: secrets-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject tracked private-key material
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(key|p12|pfx|jks|keystore)$|(^|/)(id_rsa|id_ed25519|age\.key)$'; then
            echo 'Tracked private-key material is forbidden.' >&2
            exit 1
          fi

      - name: Enforce encrypted secure-config naming
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "${file}" in
              deploy/secure-config/README.md|deploy/secure-config/.sops.yaml.example|*.sops.yaml|*.sops.yml|*.sops.json|*.sops.env)
                ;;
              *)
                echo "Unexpected unencrypted secure-config file: ${file}" >&2
                exit 1
                ;;
            esac
          done < <(git ls-files 'deploy/secure-config/*')

      - name: Run signing-key adapter tests
        run: ./apps/server/mvnw -f apps/server/pom.xml -Dtest=FileSigningKeyProviderTest test
