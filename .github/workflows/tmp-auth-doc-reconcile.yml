name: Temporary Auth Documentation Reconcile

on:
  push:
    branches:
      - feature/control-plane-auth-bootstrap
    paths:
      - .github/workflows/tmp-auth-doc-reconcile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/control-plane-auth-bootstrap
      - name: Reconcile branch and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('apps/server/src/test/java/io/wyrmgate/iam/administration/persistence/ControlPlaneAuthenticationBootstrapPersistenceIntegrationTest.java')
          test_text = test_path.read_text()
          old_accessor = 'resolved.actorIdentityId()'
          if old_accessor not in test_text:
              raise SystemExit('expected actor accessor typo not found')
          test_path.write_text(test_text.replace(old_accessor, 'resolved.identityId()'))

          path = Path('docs/api/identity-contracts.md')
          text = path.read_text()
          changes = [
              (
                  'This slice is **contract-first and not yet runtime-exposed**. The Administration capability now has a persisted default-deny direct-grant evaluator, but Wyrmgate still does not expose Identity mutation endpoints until transport authentication can resolve a caller to a governed actor/tenant and an initial administrator can be provisioned through a governed, non-self-escalating path. This avoids creating a temporary unauthenticated or unbootstrappable administration surface.',
                  'This slice remains **contract-first and not yet runtime-exposed**. Provider-neutral bearer validation, server-side tenant/governed-actor resolution, burn-once initial-administrator bootstrap, and the scoped Administrative Authorization evaluator now exist. Runtime Identity controllers remain absent until each HTTP operation is wired to both the trusted actor context and the required `identity:*` permission at operation time.'
              ),
              (
                  'That evaluator is necessary but not sufficient to expose the HTTP endpoints. Runtime activation still requires transport authentication and trusted actor/tenant resolution, plus a safe initial-administrator provisioning/management path that cannot become a self-escalation bypass. Relationship/ownership context, policy/assurance requirements and sensitive authorization-decision audit hooks are added as the corresponding governed operations require them.',
                  'The authentication, trusted actor/tenant resolution, burn-once bootstrap, and direct-grant evaluator foundations now exist. Runtime activation still requires each HTTP adapter to enforce both the authenticated actor context and the semantic Administration decision for the requested operation. Relationship/ownership context, policy/assurance requirements and sensitive authorization-decision audit hooks are added as the corresponding governed operations require them.'
              ),
          ]
          for old, new in changes:
              if old not in text:
                  raise SystemExit('expected Identity contract paragraph not found')
              text = text.replace(old, new)
          path.write_text(text)

          path = Path('apps/server/README.md')
          text = path.read_text()
          changes = [
              (
                  'This is not an authentication or bootstrap bypass. Transport bearer authentication/tenant+actor resolution, a governed initial-administrator provisioning path, role/grant management commands, delegation/elevation, assurance/policy context and sensitive authorization-decision audit hooks remain subsequent slices.',
                  'Bearer authentication, server-side tenant+actor resolution, and a burn-once governed initial-administrator bootstrap are now implemented under ADR-0011. Role/grant management commands, delegation/elevation, stronger assurance/policy context, governed recovery, and sensitive authorization-decision audit hooks remain subsequent slices.'
              ),
              (
                  'These contracts are intentionally **not runtime-exposed yet**. The persisted Administration evaluator now exists, but publishing Identity endpoints still requires trusted transport authentication/tenant+actor resolution and a safe initial-administrator provisioning path. Internal outbox facts are likewise not automatically external events; publication wiring remains a separate adapter/integration concern.',
                  'These contracts are intentionally **not runtime-exposed yet**. The Administration evaluator plus trusted bearer authentication, server-side tenant+actor resolution, and burn-once initial-administrator provisioning now exist. The next slice must wire each Identity HTTP operation to both the authenticated actor context and semantic Administration permission checks. Internal outbox facts are likewise not automatically external events; publication wiring remains a separate adapter/integration concern.'
              ),
          ]
          for old, new in changes:
              if old not in text:
                  raise SystemExit('expected server README paragraph not found')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git rm .github/workflows/tmp-auth-doc-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/test/java/io/wyrmgate/iam/administration/persistence/ControlPlaneAuthenticationBootstrapPersistenceIntegrationTest.java docs/api/identity-contracts.md apps/server/README.md
          git commit -m "test: fix actor assertion and reconcile auth docs"
          git push origin HEAD:feature/control-plane-auth-bootstrap
