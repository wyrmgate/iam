name: Promote Verified Capability Baseline

on:
  push:
    branches:
      - feature/adr-0048-clean-rebaseline
    paths:
      - '.github/workflows/promote-capability-baseline.yml'

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/adr-0048-clean-rebaseline
          fetch-depth: 0

      - name: Download schema-equivalent capability baseline
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          repository: wyrmgate/iam
          run-id: 38812534211
          name: capability-baseline-candidate
          path: /tmp/capability-baseline

      - name: Promote verified baseline and remove old migration history
        run: |
          set -euo pipefail
          runtime=apps/server/src/main/resources/db/migration
          source=/tmp/capability-baseline/wyrmgate-capability-baseline

          test -f "$source/V1__create_capability_schemas.sql"
          test -f "$source/V10__audit_baseline.sql"
          test "$(find "$source" -maxdepth 1 -type f -name 'V*.sql' | wc -l)" -eq 10

          rm -f "$runtime"/V*.sql
          cp "$source"/V*.sql "$runtime"/
          rm -rf apps/server/src/test/resources/db/history/pre-rebaseline
          rm -f tools/split-persistence-baseline.py

          test "$(find "$runtime" -maxdepth 1 -type f -name 'V*.sql' | wc -l)" -eq 10
          test ! -e apps/server/src/test/resources/db/history/pre-rebaseline
          test ! -e tools/split-persistence-baseline.py

          git config user.name 'wyrmgate-ci'
          git config user.email 'wyrmgate-ci@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'refactor(db): promote capability-organized baseline'
          git push origin HEAD:feature/adr-0048-clean-rebaseline
