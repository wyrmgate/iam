name: Edge CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/caddy/**'
      - 'deploy/compose/edge.yml'
      - 'deploy/config/edge.env.example'
      - '.github/workflows/edge.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/caddy/**'
      - 'deploy/compose/edge.yml'
      - 'deploy/config/edge.env.example'
      - '.github/workflows/edge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge:
    name: edge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare validation environment
        run: cp deploy/config/edge.env.example deploy/config/edge.env

      - name: Validate edge compose
        run: docker compose -f deploy/compose/edge.yml config --quiet

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e IAM_PUBLIC_HOST=iam.example.com \
            -e IAM_ACME_EMAIL=ops@example.com \
            -e IAM_SERVER_UPSTREAM=iam-server:8080 \
            -e IAM_CONSOLE_UPSTREAM=iam-console:8080 \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
