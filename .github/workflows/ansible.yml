name: Ansible CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/ansible/**'
      - '.github/workflows/ansible.yml'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - 'infra/ansible/**'
      - '.github/workflows/ansible.yml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible:
    name: ansible
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: infra/ansible/requirements.txt

      - name: Install Ansible tooling
        run: python -m pip install -r infra/ansible/requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r infra/ansible/requirements.yml

      - name: Lint Ansible content
        working-directory: infra/ansible
        run: ansible-lint

      - name: Syntax-check provisioning playbook
        working-directory: infra/ansible
        run: ansible-playbook -i inventory/ci.ini site.yml --syntax-check
