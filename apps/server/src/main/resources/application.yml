spring:
  application:
    name: wyrmgate-iam
  datasource:
    url: ${IAM_DB_URL:jdbc:postgresql://localhost:5432/wyrmgate_iam}
    username: ${IAM_DB_USER:wyrmgate}
    password: ${IAM_DB_PASSWORD:wyrmgate}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${IAM_TRACE_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    enabled: ${IAM_OTEL_ENABLED:false}
    resource-attributes:
      deployment.environment.name: ${IAM_DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${IAM_OTEL_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: ${IAM_OTEL_ENABLED:false}
        url: ${IAM_OTEL_METRICS_ENDPOINT:http://127.0.0.1:4318/v1/metrics}

logging:
  pattern:
    correlation: '[%X{traceId:-},%X{spanId:-}] '

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs

iam:
  auth:
    enabled: ${IAM_AUTH_ENABLED:false}
    issuer-uri: ${IAM_AUTH_ISSUER_URI:}
    audience: ${IAM_AUTH_AUDIENCE:}
  signing:
    enabled: ${IAM_SIGNING_ENABLED:false}
    key-id: ${IAM_SIGNING_KEY_ID:}
    key-algorithm: ${IAM_SIGNING_KEY_ALGORITHM:RSA}
    signing-algorithm: ${IAM_SIGNING_ALGORITHM:SHA256withRSA}
    private-key-path: ${IAM_SIGNING_PRIVATE_KEY_PATH:}
    public-key-path: ${IAM_SIGNING_PUBLIC_KEY_PATH:}
    verification-keys: ${IAM_SIGNING_VERIFICATION_KEYS:}
  api:
    cursor:
      lifetime: ${IAM_API_CURSOR_LIFETIME:PT15M}
  integration:
    worker-auth:
      enabled: ${IAM_CONNECTOR_WORKER_AUTH_ENABLED:false}
      issuer-uri: ${IAM_CONNECTOR_WORKER_ISSUER_URI:}
      audience: ${IAM_CONNECTOR_WORKER_AUDIENCE:}
    worker-protocol:
      session-lifetime: ${IAM_CONNECTOR_WORKER_SESSION_LIFETIME:PT15M}
      lease-duration: ${IAM_CONNECTOR_WORKER_LEASE_DURATION:PT30S}
      max-claim-size: ${IAM_CONNECTOR_WORKER_MAX_CLAIM_SIZE:50}
      max-long-poll-seconds: ${IAM_CONNECTOR_WORKER_MAX_LONG_POLL_SECONDS:20}
      max-observation-batch-size: ${IAM_CONNECTOR_WORKER_MAX_OBSERVATION_BATCH_SIZE:500}
    events:
      enabled: ${IAM_INTEGRATION_EVENTS_ENABLED:false}
      transport: ${IAM_INTEGRATION_EVENTS_TRANSPORT:}
      poll-interval: ${IAM_INTEGRATION_EVENTS_POLL_INTERVAL:PT1S}
      claim-lease: ${IAM_INTEGRATION_EVENTS_CLAIM_LEASE:PT30S}
      batch-size: ${IAM_INTEGRATION_EVENTS_BATCH_SIZE:50}
      retry-base-delay: ${IAM_INTEGRATION_EVENTS_RETRY_BASE_DELAY:PT5S}
      retry-max-delay: ${IAM_INTEGRATION_EVENTS_RETRY_MAX_DELAY:PT5M}
      webhook:
        endpoint: ${IAM_INTEGRATION_EVENTS_WEBHOOK_ENDPOINT:}
        secret: ${IAM_INTEGRATION_EVENTS_WEBHOOK_SECRET:}
        connect-timeout: ${IAM_INTEGRATION_EVENTS_WEBHOOK_CONNECT_TIMEOUT:PT5S}
        request-timeout: ${IAM_INTEGRATION_EVENTS_WEBHOOK_REQUEST_TIMEOUT:PT10S}
  bootstrap:
    initial-admin:
      enabled: ${IAM_INITIAL_ADMIN_BOOTSTRAP_ENABLED:false}
      tenant-id: ${IAM_INITIAL_ADMIN_TENANT_ID:}
      identity-id: ${IAM_INITIAL_ADMIN_IDENTITY_ID:}
      issuer: ${IAM_INITIAL_ADMIN_ISSUER:}
      subject: ${IAM_INITIAL_ADMIN_SUBJECT:}

server:
  port: ${PORT:8080}
  shutdown: graceful
