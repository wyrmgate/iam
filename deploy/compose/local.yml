services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${IAM_DB_NAME:-wyrmgate_iam}
      POSTGRES_USER: ${IAM_DB_USER:-wyrmgate}
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD:-wyrmgate_local_dev}
    ports:
      - "127.0.0.1:${IAM_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IAM_DB_USER:-wyrmgate} -d ${IAM_DB_NAME:-wyrmgate_iam}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${IAM_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:${IAM_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${IAM_MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../config/otel-collector.local.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${IAM_OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${IAM_OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${IAM_OTEL_HEALTH_PORT:-13133}:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
