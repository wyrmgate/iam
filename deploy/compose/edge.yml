services:
  caddy:
    image: caddy:2.11.4-alpine
    env_file:
      - ../config/edge.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    restart: unless-stopped

networks:
  edge:
    name: wyrmgate-edge
    external: true

volumes:
  caddy-data:
    name: wyrmgate-caddy-data
  caddy-config:
    name: wyrmgate-caddy-config
